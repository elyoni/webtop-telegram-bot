[project]
name = "webtop-bot"
version = "0.5.1"
description = "Telegram bot: daily Webtop homework digests, synced to Todoist"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # Fork with the weekly lessons/homework API (upstream PR t0mer/pywebtop#3), pinned to a commit.
    "pywebtop @ git+https://github.com/elyoni/pywebtop@b1643c9683aa3de922dc315263fa33a9fb62dcdc",
    "python-telegram-bot[job-queue]>=21,<23",
    "httpx>=0.25,<1.0",
    "tzdata",
]

[project.scripts]
webtop-bot = "webtop_bot.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
# Only resolve package versions that have been public for at least ~2 weeks.
exclude-newer = "2026-10-06T00:00:00Z"

[tool.hatch.metadata]
allow-direct-references = true  # pywebtop git dependency
