[project]
name = "webtop-bot"
version = "0.2.0"
description = "Telegram bot: daily Webtop homework digests, synced to Todoist or Microsoft To Do"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pywebtop",
    "python-telegram-bot[job-queue]>=21,<23",
    "msal>=1.28,<2",
    "httpx>=0.25,<1.0",
    "tzdata",
]

[project.scripts]
webtop-bot = "webtop_bot.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
# Only resolve package versions that have been public for at least ~2 weeks.
exclude-newer = "2026-10-06T00:00:00Z"

[tool.uv.sources]
pywebtop = { path = "../pywebtop", editable = true }
